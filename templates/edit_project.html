{% extends 'base.html' %}

{% block content %}
    <h2>Edit Project</h2>

    <form method="POST" action="{{ url_for('edit_project', id=project.id) }}">
        <p>
            <label>Title:</label><br>
            <input type="text" name="title" value="{{ project.title }}" required>
        </p>
        <p>
            <label>Description:</label><br>
            <textarea name="description" rows="4" cols="50">{{ project.description }}</textarea>
        </p>
        <p>
            <label>Start Date:</label><br>
            <input type="date" name="start_date" value="{{ project.start_date }}" required>
        </p>
        <p>
            <label>End Date:</label><br>
            <input type="date" name="end_date" value="{{ project.end_date }}">
        </p>
        <p>
            <label>Link:</label><br>
            <input type="text" name="link" value="{{ project.link }}">
        </p>
        <p>
            <button type="submit">Update Project</button>
        </p>
    </form>

    <a href="{{ url_for('projects') }}">← Back to Projects</a>

{% endblock %}
